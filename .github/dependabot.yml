version: 2
multi-ecosystem-groups:
  monthly-deps:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-deps

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-deps

  - package-ecosystem: docker
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-deps

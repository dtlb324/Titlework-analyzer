name: Secret scan

on:
  pull_request:
  push:
    branches:
      - Main
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan commits in this pull request or push
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Scan the commits introduced here, not the entire history. Old
          # commits stay in the audit report instead of failing every later PR.
          log_opts=()
          case "$EVENT_NAME" in
            pull_request)
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Refusing to scan: pull request base is not a commit SHA." >&2
                exit 1
              fi
              log_opts=(--log-opts "${BASE_SHA}..HEAD")
              ;;
            push)
              # A new branch sets before to 40 zeros. A force-push can leave
              # before missing or not present in this checkout. Neither value
              # is a git range, so scan from the default branch instead.
              zero=0000000000000000000000000000000000000000
              before=$(printf '%s' "${BEFORE_SHA:-}" | tr '[:upper:]' '[:lower:]')
              range=""
              if [[ "$before" =~ ^[0-9a-f]{40}$ && "$before" != "$zero" ]] && git cat-file -e "${before}^{commit}" >/dev/null 2>&1; then
                range="${before}..HEAD"
              else
                head_sha=$(git rev-parse HEAD)
                candidates=()
                if [[ "${DEFAULT_BRANCH:-}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                  candidates+=("origin/${DEFAULT_BRANCH}")
                fi
                candidates+=(origin/Main origin/main)
                for ref in "${candidates[@]}"; do
                  if base_sha=$(git rev-parse --verify --quiet "$ref") && [[ "$base_sha" != "$head_sha" ]]; then
                    range="${base_sha}..HEAD"
                    break
                  fi
                done
              fi
              if [[ -z "$range" ]]; then
                range="-1"
              fi
              log_opts=(--log-opts "$range")
              ;;
            *)
              echo "Refusing to scan: unsupported event." >&2
              exit 1
              ;;
          esac
          gitleaks detect --source . --redact --no-banner "${log_opts[@]}"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mineral Title Analyzer — Joe Brown Insurance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #1a1208;
    background-image:
      radial-gradient(ellipse at 20% 20%, #2a1e0a 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #0f1a10 0%, transparent 60%);
    min-height: 100vh;
    color: #c4b99a;
    padding-bottom: 3rem;
  }
  .header {
    border-bottom: 1px solid #3a2e1a;
    background: linear-gradient(180deg, #0e0b05 0%, #1a1208 100%);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  .eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: #6b5a3a;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: normal;
    color: #c8a96e;
    letter-spacing: 0.02em;
    margin-bottom: 0.3rem;
  }
  .tagline {
    color: #5a4a2a;
    font-size: 0.85rem;
    font-style: italic;
  }
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .card {
    background: rgba(255,255,255,0.02);
    border: 1px solid #3a2e1a;
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6b5a3a;
    margin-bottom: 0.5rem;
  }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    background: #0e0b05;
    border: 1px solid #3a2e1a;
    border-radius: 3px;
    color: #c4b99a;
    padding: 0.65rem 0.85rem;
    font-size: 0.92rem;
    font-family: Georgia, serif;
    outline: none;
  }
  input:focus, textarea:focus { border-color: #c8a96e; }
  textarea { resize: vertical; min-height: 60px; }
  .field { margin-bottom: 1.2rem; }
  .upload-zone {
    border: 2px dashed #3a2e1a;
    border-radius: 4px;
    padding: 1.5rem;
    text-align: center;
    background: #0e0b05;
    transition: border-color 0.2s;
  }
  .upload-zone.drag { border-color: #c8a96e; background: #1a1208; }
  .upload-zone label {
    cursor: pointer;
    color: #c8a96e;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    text-transform: none;
    margin-bottom: 0;
  }
  .upload-zone .hint {
    color: #5a4a2a;
    font-size: 0.75rem;
    margin-top: 0.5rem;
  }
  .file-list { margin-top: 1rem; }
  .file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.75rem;
    background: #0e0b05;
    border: 1px solid #2a2010;
    border-radius: 3px;
    margin-bottom: 0.3rem;
    font-size: 0.85rem;
  }
  .file-item span { color: #c4b99a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
  .file-item button {
    background: none; border: none; color: #6b5a3a;
    cursor: pointer; font-size: 1.2rem;
  }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, #3a2a0a, #2a1e06);
    border: 1px solid #c8a96e;
    color: #c8a96e;
    padding: 0.85rem;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    border-radius: 3px;
    font-family: Georgia, serif;
    cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #4a3510, #3a2810); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    border: 1px solid #3a2e1a;
    color: #6b5a3a;
    padding: 0.55rem 1.2rem;
    cursor: pointer;
    border-radius: 3px;
    font-family: Georgia, serif;
    font-size: 0.82rem;
  }
  .btn-send {
    background: #2a1e06;
    border: 1px solid #c8a96e;
    color: #c8a96e;
    padding: 0.65rem 1.2rem;
    cursor: pointer;
    border-radius: 3px;
    font-family: Georgia, serif;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .analysis-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid #3a2e1a;
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
  }
  .analysis-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: #4a3a1a;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .analysis-content h2 {
    color: #e8d5b0;
    font-size: 1.1rem;
    margin-top: 1.2rem;
    margin-bottom: 0.5rem;
    font-weight: normal;
  }
  .analysis-content h3 {
    color: #c8a96e;
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid #3a2e1a;
    padding-bottom: 0.3rem;
    font-weight: normal;
  }
  .analysis-content p { color: #c4b99a; margin-bottom: 0.4rem; line-height: 1.6; }
  .analysis-content strong { color: #e8d5b0; }
  .analysis-content ul { padding-left: 1.5rem; margin-bottom: 0.5rem; }
  .analysis-content li { color: #c4b99a; margin-bottom: 0.2rem; line-height: 1.55; list-style: none; position: relative; }
  .analysis-content li::before { content: "›"; color: #c8a96e; position: absolute; left: -1rem; }
  .analysis-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 1rem 0;
    font-size: 0.88rem;
  }
  .analysis-content th, .analysis-content td {
    border: 1px solid #3a2e1a;
    padding: 0.5rem 0.7rem;
    text-align: left;
  }
  .analysis-content th { background: #2a1e06; color: #c8a96e; font-weight: normal; letter-spacing: 0.05em; }
  .analysis-content td { color: #c4b99a; }
  .question-card {
    background: #0e0b05;
    border: 1px solid #2a2010;
    border-radius: 4px;
    padding: 0.8rem 1rem;
    margin-bottom: 1.2rem;
    font-size: 0.9rem;
    color: #a89a78;
    font-style: italic;
  }
  .followup-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .followup-row input { flex: 1; min-width: 200px; }
  .loading {
    text-align: center;
    color: #6b5a3a;
    padding: 2rem;
    font-style: italic;
  }
  .loading::after {
    content: '...';
    animation: dots 1.5s infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }
  .error-msg {
    background: #3a1010;
    border: 1px solid #a04040;
    color: #f0c4b0;
    padding: 0.8rem 1rem;
    border-radius: 3px;
    margin-bottom: 1rem;
    font-size: 0.88rem;
  }
  .password-gate {
    max-width: 400px;
    margin: 4rem auto;
    padding: 2rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid #3a2e1a;
    border-radius: 4px;
    text-align: center;
  }
  .password-gate h2 {
    color: #c8a96e;
    margin-bottom: 1rem;
    font-weight: normal;
  }
  .password-gate p {
    color: #6b5a3a;
    font-size: 0.85rem;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">⬡ Chain of Title Analyzer ⬡</div>
  <h1>Mineral Ownership Builder</h1>
  <div class="tagline">Joe Brown Insurance — Title Research Tool</div>
</div>

<div class="container">

  <!-- Password gate (only shown if password is required) -->
  <div id="passwordGate" class="password-gate" style="display:none">
    <h2>Access Required</h2>
    <p>Enter the access password provided by your administrator.</p>
    <div class="field">
      <input type="password" id="passwordInput" placeholder="Password..." />
    </div>
    <button class="btn-primary" onclick="checkPassword()">Enter</button>
    <div id="passwordError"></div>
  </div>

  <!-- Main app -->
  <div id="mainApp">
    <!-- Upload Section -->
    <div class="card" id="uploadSection">
      <div class="field">
        <label>Subject Tract Description (optional)</label>
        <input type="text" id="tractDescription" placeholder="e.g. SE/4 of Section 14, T-3-N, R-5-W, Reeves County, TX" />
      </div>

      <div class="field">
        <label>Additional Context (optional)</label>
        <textarea id="contextNotes" placeholder="Time period, known issues, specific questions, original patent date, etc." rows="2"></textarea>
      </div>

      <div class="field">
        <label>Upload Documents (PDFs or images)</label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" multiple accept=".pdf,image/*" style="display:none" />
          <label for="fileInput">⬆ Click to select deeds, probate, assignments...</label>
          <div class="hint">PDF or image files · Multiple uploads supported · Drag &amp; drop also works</div>
        </div>
      </div>

      <div class="file-list" id="fileList"></div>

      <button class="btn-primary" id="analyzeBtn" onclick="analyze()" disabled>
        → Build Chain of Title
      </button>
    </div>

    <div id="errorBox"></div>
    <div id="results"></div>
    <div class="loading" id="loadingBox" style="display:none">Reading documents and tracing title</div>

    <div id="followupSection" style="display:none">
      <div class="card">
        <label>Follow-up Question</label>
        <div class="followup-row">
          <input type="text" id="followupInput" placeholder="Ask about specific owners, fractions, gaps, curative items..." />
          <button class="btn-send" onclick="askFollowup()">Ask</button>
        </div>
        <button class="btn-secondary" onclick="resetAll()" style="margin-top: 1rem;">← New Analysis</button>
      </div>
    </div>
  </div>

</div>

<script>
const SYSTEM_PROMPT = `You are a Texas-licensed oil and gas title attorney with 30+ years of experience rendering Drilling Title Opinions and Division Order Title Opinions. You have been engaged to analyze courthouse documents and determine mineral ownership for a subject tract.

Approach this with the rigor of a formal title opinion. You will receive deeds, assignments, probate orders, wills, affidavits of heirship, leases, division orders, mortgages, releases, and similar instruments.

DELIVER YOUR ANALYSIS IN THIS STRUCTURE:

## DOCUMENT ABSTRACT
For each document, provide:
- Document #, Type
- Date executed / Date recorded
- Vol/Page or Document/Instrument number
- Grantor(s) → Grantee(s)
- Legal description (subject tract reference)
- Interest conveyed (fee surface, fee minerals, mineral only, royalty, NPRI, term interest, etc.)
- Fraction conveyed
- Reservations / exceptions / conditions
- Notable language (warranty type, after-acquired title, etc.)

## CHAIN OF TITLE
Chronological flow showing how title moved. Show your fractional math at each step.

## MINERAL INTEREST CALCULATION
Show the fractional math in detail. Use a table when helpful. Account separately for:
- Surface estate
- Mineral estate (executive rights)
- Royalty interest
- Non-Participating Royalty Interest (NPRI)
- Outstanding leasehold interests
- Term/defeasible interests

## TITLE DEFECTS & CURATIVE REQUIREMENTS
Flag every issue formally. For each defect, specify the curative document needed (Affidavit of Heirship, Stipulation of Interest, Release, Quitclaim, etc.)

## FINAL OWNERSHIP DETERMINATION
A clean table:
| Owner | Mineral Interest | Royalty/NPRI | Subject To | Notes |

## OPINION QUALIFICATIONS
List the assumptions you made and limitations of this analysis. Note that this is an analytical aid, not a substitute for a formal title opinion of an attorney licensed in the state where the land lies.

---

Be precise with fractions. Always show your math. Use formal title opinion language but keep it readable. If a document is illegible or you cannot determine something, say so plainly and list what additional information would be needed.`;

// State
let appPassword = sessionStorage.getItem('app_password') || '';
let files = [];
let conversationHistory = [];
let passwordRequired = false;

// Init
document.addEventListener('DOMContentLoaded', async () => {
  // Check if password gate is needed
  await checkPasswordRequired();
  setupDragDrop();
  document.getElementById('fileInput').addEventListener('change', handleFileSelect);
  document.getElementById('followupInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') askFollowup();
  });
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });
});

async function checkPasswordRequired() {
  // Try a tiny ping to see if password is needed
  try {
    const r = await fetch('/api/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-app-password': appPassword,
      },
      body: JSON.stringify({ ping: true }),
    });
    if (r.status === 401) {
      passwordRequired = true;
      document.getElementById('passwordGate').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
    } else {
      // Either no password required, or already authed
      document.getElementById('passwordGate').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
    }
  } catch (e) {
    // Network error — show main app, error will surface on first call
    document.getElementById('mainApp').style.display = 'block';
  }
}

function checkPassword() {
  const pw = document.getElementById('passwordInput').value.trim();
  if (!pw) return;
  appPassword = pw;
  sessionStorage.setItem('app_password', pw);
  // Try a real call to validate
  fetch('/api/analyze', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-app-password': appPassword,
    },
    body: JSON.stringify({ ping: true }),
  }).then(r => {
    if (r.status === 401) {
      document.getElementById('passwordError').innerHTML = '<div class="error-msg">Incorrect password.</div>';
      sessionStorage.removeItem('app_password');
      appPassword = '';
    } else {
      document.getElementById('passwordGate').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
    }
  });
}

function setupDragDrop() {
  const zone = document.getElementById('uploadZone');
  ['dragenter', 'dragover'].forEach(evt => {
    zone.addEventListener(evt, e => {
      e.preventDefault(); e.stopPropagation();
      zone.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    zone.addEventListener(evt, e => {
      e.preventDefault(); e.stopPropagation();
      zone.classList.remove('drag');
    });
  });
  zone.addEventListener('drop', e => {
    handleFiles(Array.from(e.dataTransfer.files));
  });
}

async function handleFileSelect(e) {
  await handleFiles(Array.from(e.target.files));
  e.target.value = '';
}

async function handleFiles(newFiles) {
  for (const file of newFiles) {
    const data = await readFileAsBase64(file);
    files.push({
      name: file.name,
      type: file.type,
      size: file.size,
      data: data,
    });
  }
  renderFileList();
  updateAnalyzeButton();
}

function readFileAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}

function renderFileList() {
  const list = document.getElementById('fileList');
  if (files.length === 0) { list.innerHTML = ''; return; }
  list.innerHTML = `
    <div style="font-size: 0.7rem; letter-spacing: 0.15em; color: #6b5a3a; text-transform: uppercase; margin-bottom: 0.5rem;">
      ${files.length} document${files.length !== 1 ? 's' : ''} loaded
    </div>
  ` + files.map((f, i) => `
    <div class="file-item">
      <span>📄 ${escapeHtml(f.name)}</span>
      <button onclick="removeFile(${i})" title="Remove">×</button>
    </div>
  `).join('');
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFileList();
  updateAnalyzeButton();
}

function updateAnalyzeButton() {
  document.getElementById('analyzeBtn').disabled = files.length === 0;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function showError(msg) {
  document.getElementById('errorBox').innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
}

function clearError() {
  document.getElementById('errorBox').innerHTML = '';
}

function buildContent(userText) {
  const content = [];
  for (const f of files) {
    if (f.type === 'application/pdf') {
      content.push({
        type: 'document',
        source: { type: 'base64', media_type: 'application/pdf', data: f.data },
      });
    } else if (f.type.startsWith('image/')) {
      content.push({
        type: 'image',
        source: { type: 'base64', media_type: f.type, data: f.data },
      });
    }
  }
  content.push({ type: 'text', text: userText });
  return content;
}

async function callBackend(messages) {
  const response = await fetch('/api/analyze', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-app-password': appPassword,
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 4000,
      system: SYSTEM_PROMPT,
      messages: messages,
    }),
  });
  const data = await response.json();
  if (!response.ok || data.error) {
    throw new Error(data.error?.message || data.error || `HTTP ${response.status}`);
  }
  return data.content?.map(b => b.text || '').join('') || '';
}

async function analyze() {
  if (files.length === 0) return;

  clearError();
  document.getElementById('analyzeBtn').disabled = true;
  document.getElementById('loadingBox').style.display = 'block';

  const tract = document.getElementById('tractDescription').value;
  const ctx = document.getElementById('contextNotes').value;

  let userText = `Please analyze the following ${files.length} courthouse document(s) and provide a formal title opinion analysis with chain of title and mineral ownership determination.\n\n`;
  if (tract) userText += `**Subject Tract:** ${tract}\n\n`;
  if (ctx) userText += `**Additional Context:** ${ctx}\n\n`;
  userText += `**Documents Submitted:** ${files.map(f => f.name).join(', ')}`;

  const content = buildContent(userText);

  try {
    const reply = await callBackend([{ role: 'user', content: content }]);
    conversationHistory = [
      { role: 'user', content: content },
      { role: 'assistant', content: reply },
    ];
    renderResults();
    document.getElementById('followupSection').style.display = 'block';
    document.getElementById('uploadSection').style.display = 'none';
  } catch (e) {
    showError('Error: ' + e.message);
  } finally {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
  }
}

async function askFollowup() {
  const q = document.getElementById('followupInput').value.trim();
  if (!q) return;
  document.getElementById('followupInput').value = '';
  document.getElementById('loadingBox').style.display = 'block';
  clearError();

  conversationHistory.push({ role: 'user', content: q });
  renderResults();

  try {
    const reply = await callBackend(conversationHistory);
    conversationHistory.push({ role: 'assistant', content: reply });
    renderResults();
  } catch (e) {
    showError('Error: ' + e.message);
    conversationHistory.pop();
  } finally {
    document.getElementById('loadingBox').style.display = 'none';
  }
}

function renderResults() {
  const container = document.getElementById('results');
  let html = '';
  for (let i = 0; i < conversationHistory.length; i++) {
    const m = conversationHistory[i];
    if (m.role === 'assistant') {
      html += `
        <div class="analysis-card">
          <div class="analysis-eyebrow">◈ Title Opinion Analysis</div>
          <div class="analysis-content">${formatMarkdown(m.content)}</div>
        </div>
      `;
    } else if (m.role === 'user' && i > 0) {
      const text = typeof m.content === 'string' ? m.content : '';
      if (text) {
        html += `<div class="question-card">Q: ${escapeHtml(text)}</div>`;
      }
    }
  }
  container.innerHTML = html;
}

function formatMarkdown(text) {
  let html = escapeHtml(text);

  // Tables
  html = html.replace(/(\|[^\n]+\|\n)+/g, (match) => {
    const rows = match.trim().split('\n');
    if (rows.length < 2) return match;
    let bodyStart = 1;
    if (rows[1] && /^\|?[\s\-\|:]+\|?$/.test(rows[1].trim())) bodyStart = 2;
    const headers = rows[0].split('|').map(c => c.trim()).filter(c => c);
    const headerHtml = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
    const bodyHtml = rows.slice(bodyStart).map(r => {
      const cells = r.split('|').map(c => c.trim());
      const filtered = cells.filter((c, i) => !(i === 0 && c === '') && !(i === cells.length - 1 && c === ''));
      return '<tr>' + filtered.map(c => `<td>${c}</td>`).join('') + '</tr>';
    }).join('');
    return `<table>${headerHtml}${bodyHtml}</table>`;
  });

  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<![\*\w])\*(?!\s)([^\*\n]+?)\*(?!\w)/g, '<em>$1</em>');

  html = html.replace(/(?:^[\-\*•]\s+.+(?:\n|$))+/gm, (match) => {
    const items = match.trim().split('\n').map(l => {
      const content = l.replace(/^[\-\*•]\s+/, '');
      return `<li>${content}</li>`;
    }).join('');
    return `<ul>${items}</ul>`;
  });

  html = html.split('\n\n').map(block => {
    block = block.trim();
    if (!block) return '';
    if (block.startsWith('<h') || block.startsWith('<ul') || block.startsWith('<table')) return block;
    return `<p>${block.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');

  return html;
}

function resetAll() {
  files = [];
  conversationHistory = [];
  document.getElementById('tractDescription').value = '';
  document.getElementById('contextNotes').value = '';
  document.getElementById('results').innerHTML = '';
  document.getElementById('followupInput').value = '';
  document.getElementById('followupSection').style.display = 'none';
  document.getElementById('uploadSection').style.display = 'block';
  renderFileList();
  updateAnalyzeButton();
  clearError();
}
</script>

</body>
</html>
